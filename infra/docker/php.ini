expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
upload_max_filesize = 30M
post_max_size = 32M
max_execution_time = 60
session.cookie_httponly = 1
session.cookie_secure = 1
allow_url_fopen = Off

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000

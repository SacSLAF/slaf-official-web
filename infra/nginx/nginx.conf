user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    client_max_body_size 32m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # Edge rate limiting (Laravel applies finer per-route limits behind this).
    limit_req_zone $binary_remote_addr zone=site:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:20m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=cms_login:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn:20m;
    limit_req_status 429;

    # Short micro-cache for public pages: absorbs spikes such as recruitment or exam result days.
    proxy_cache_path /var/cache/nginx/site levels=1:2 keys_zone=site:50m max_size=1g inactive=10m use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}

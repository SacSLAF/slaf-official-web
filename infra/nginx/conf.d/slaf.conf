# Hostnames are examples; replace with the real names and certificates.
#   www.airforce.lk   public site (Next.js "web")
#   api.airforce.lk   public read API + tender downloads + media
#   cms.airforce.lk   admin console — reachable ONLY from approved internal ranges

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Shared TLS settings -------------------------------------------------
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:20m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_stapling on;
ssl_stapling_verify on;

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# --- Public site ---------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name www.airforce.lk airforce.lk;

    ssl_certificate     /etc/nginx/certs/airforce.lk.crt;
    ssl_certificate_key /etc/nginx/certs/airforce.lk.key;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    limit_req zone=site burst=60 nodelay;
    limit_conn conn 50;

    # The revalidation webhook is internal only (called by the API over the app network).
    location = /api/revalidate { return 404; }

    location /_next/static/ {
        proxy_pass http://web:3000;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        proxy_cache site;
        proxy_cache_valid 200 30s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status;
    }
}

# --- Public API ----------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.airforce.lk;

    ssl_certificate     /etc/nginx/certs/airforce.lk.crt;
    ssl_certificate_key /etc/nginx/certs/airforce.lk.key;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    root /var/www/api/public;
    limit_req zone=api burst=40 nodelay;

    # The administrative API is never exposed on the public hostname.
    location ^~ /api/admin { return 404; }

    location /storage/ {
        alias /var/www/api/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff;
        # Only images are ever stored here; never execute or sniff anything else.
        location ~* \.(php|phtml|html?|svg|js)$ { return 403; }
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass api:9000;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}

# --- Internal API vhost (app network only, port not published) -----------
# Used server-side by web (public reads) and admin (BFF → /api/admin).
server {
    listen 8081;
    server_name nginx;

    allow 172.30.1.0/24;
    deny all;

    root /var/www/api/public;

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_pass api:9000;
    }

    location ~ \.php$ { return 404; }
}

# --- Admin console -------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name cms.airforce.lk;

    ssl_certificate     /etc/nginx/certs/cms.airforce.lk.crt;
    ssl_certificate_key /etc/nginx/certs/cms.airforce.lk.key;

    # Optional mutual TLS for officer workstations:
    # ssl_client_certificate /etc/nginx/certs/slaf-client-ca.crt;
    # ssl_verify_client on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Approved networks only (internal military ranges / VPN egress). Replace these.
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    deny all;

    location = /api/auth/login {
        limit_req zone=cms_login burst=5 nodelay;
        proxy_pass http://admin:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://admin:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
